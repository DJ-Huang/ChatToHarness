name: Website
run-name: Website deploy ${{ inputs.deployment_request || github.run_id }}
on:
  push:
    branches: [main]
    paths: ['docs/**', 'site/**', 'scripts/*site*.cjs', 'tests/*site*.test.cjs', 'tests/fixtures/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml', '.github/workflows/desktop.yml']
  pull_request:
    branches: [main]
    paths: ['docs/**', 'site/**', 'scripts/*site*.cjs', 'tests/*site*.test.cjs', 'tests/fixtures/**', 'package.json', 'package-lock.json', '.github/workflows/pages.yml', '.github/workflows/desktop.yml']
  release:
    types: [published, edited, released, deleted]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Required published release tag (empty resolves latest stable)
        type: string
        default: ''
      deployment_request:
        description: Correlation ID for a calling release workflow
        type: string
        default: ''
  workflow_call:
permissions:
  contents: read
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'release' && format('release-{0}', github.run_id) || 'production' }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Deploy release website from main and wait for verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.action != 'deleted' && !github.event.release.prerelease && !github.event.release.draft && github.event.release.tag_name || '' }}
        run: node scripts/dispatch-site.cjs
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.site.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - run: npm ci --ignore-scripts
      - run: node --test tests/*site*.test.cjs
      - name: Build with published stable downloads
        id: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CTH_RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: node scripts/build-site.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - uses: actions/configure-pages@v5
      # Release/tag callers dispatch this workflow on main. Reusing their event
      # context can report deployment success while still serving the old artifact:
      # https://github.com/actions/deploy-pages/issues/383
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify production versions and downloads in all languages
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: node scripts/verify-site.cjs "$EXPECTED_VERSION"
