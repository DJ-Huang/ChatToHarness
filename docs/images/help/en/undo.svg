ill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">3</text><text x="801" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">Restore when needed</text><text x="801" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">Undo only if unchanged</text><text x="801" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">Compare conflicts; do not</text><text x="801" y="332" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">overwrite</text><text x="52" y="437" fill="#8b9bb2" font-family="system-ui,sans-serif" font-size="11">WORKFLOW ILLUSTRATION · VERIFY ACTUAL RESULTS IN THE APP AND CLIENT</text></svg>