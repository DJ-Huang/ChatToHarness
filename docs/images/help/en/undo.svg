<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc"><title id="title">Safe text edits and undo</title><desc id="desc">Read the current file / Specify the intended change
