パス・種類・サイズを照合</desc><rect width="1160" height="470" fill="#f5f7fc"/><text x="52" y="57" fill="#8496b3" font-family="system-ui,sans-serif" font-size="12" letter-spacing="3">CHATTOHARNESS / USER GUIDE</text><text x="52" y="108" fill="#263f66" font-family="system-ui,sans-serif" font-size="29" font-weight="650">ファイル作業の三つの確認</text><rect x="52" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="87" cy="189" r="15" fill="#e9efff"/><text x="87" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">1</text><text x="77" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">範囲を指定</text><text x="77" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">対象フォルダーを許可</text><text x="77" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">絶対パスを伝える</text><text x="399" y="276" text-anchor="middle" fill="#a7b8d2" font-family="system-ui,sans-serif" font-size="24">→</text><rect x="414" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="449" cy="189" r="15" fill="#e9efff"/><text x="449" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">2</text><text x="439" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">読んでから操作</text><text x="439" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">現状を先に確認</text><text x="439" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">表計算はシートと範囲を指定</text><text x="761" y="276" text-anchor="middle" fill="#a7b8d2" font-family="system-ui,sans-serif" font-size="24">→</text><rect x="776" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="811" cy="189" r="15" fill="#e9efff"/><text x="811" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">3</text><text x="801" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">実ファイルを確認</text><text x="801" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">結果の内容を再読</text><text x="801" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">パス・種類・サイズを照合</text><text x="52" y="437" fill="#8b9bb2" font-family="system-ui,sans-serif" font-size="11">操作の流れ · 実際の結果はアプリとクライアントで確認</text></svg>