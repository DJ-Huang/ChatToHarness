<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc"><title id="title">ファイル作業の三つの確認</title><desc id="desc">範囲を指定 / 対象フォルダーを許可
