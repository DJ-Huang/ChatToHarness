<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc"><title id="title">必要な範囲にアクセスを設定</title><desc id="desc">ファイルの範囲 / 本機でフォルダーを選ぶ
許可解除でファイルは消えない / プロセスと権限 / 端末はユーザー権限で実行
フォルダー設定は隔離ではない / キーと記録 / キーは本機で安全に保存
共有前に記録を確認</desc><rect width="1160" height="470" fill="#f5f7fc"/><text x="52" y="57" fill="#8496b3" font-family="system-ui,sans-serif" font-size="12" letter-spacing="3">CHATTOHARNESS / USER GUIDE</text><text x="52" y="108" fill="#263f66" font-family="system-ui,sans-serif" font-size="29" font-weight="650">必要な範囲にアクセスを設定</text><rect x="52" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="87" cy="189" r="15" fill="#e9efff"/><text x="87" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">1</text><text x="77" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">ファイルの範囲</text><text x="77" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">本機でフォルダーを選ぶ</text><text x="77" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">許可解除でファイルは消えない</text><text x="399" y="276" text-anchor="middle" fill="#a7b8d2" font-family="system-ui,sans-serif" font-size="24">→</text><rect x="414" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="449" cy="189" r="15" fill="#e9efff"/><text x="449" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">2</text><text x="439" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">プロセスと権限</text><text x="439" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">端末はユーザー権限で実行</text><text x="439" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">フォルダー設定は隔離ではない</text><text x="761" y="276" text-anchor="middle" fill="#a7b8d2" font-family="system-ui,sans-serif" font-size="24">→</text><rect x="776" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="811" cy="189" r="15" fill="#e9efff"/><text x="811" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">3</text><text x="801" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">キーと記録</text><text x="801" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">キーは本機で安全に保存</text><text x="801" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">共有前に記録を確認</text><text x="52" y="437" fill="#8b9bb2" font-family="system-ui,sans-serif" font-size="11">操作の流れ · 実際の結果はアプリとクライアントで確認</text></svg>