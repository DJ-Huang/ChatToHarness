<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc"><title id="title">同じ ID でタスクを確認する</title><desc id="desc">登録して ID を残す / コマンドと実行先を指定
登録と完了は別 / 確認を続ける / 状態・ログ・成果物
切断後も元の ID を使う / 完了または取消 / 最終状態を確認
閉じるだけでは止まらない</desc><rect width="1160" height="470" fill="#f5f7fc"/><text x="52" y="57" fill="#8496b3" font-family="system-ui,sans-serif" font-size="12" letter-spacing="3">CHATTOHARNESS / USER GUIDE</text><text x="52" y="108" fill="#263f66" font-family="system-ui,sans-serif" font-size="29" font-weight="650">同じ ID でタスクを確認する</text><rect x="52" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="87" cy="189" r="15" fill="#e9efff"/><text x="87" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">1</text><text x="77" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">登録して ID を残す</text><text x="77" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">コマンドと実行先を指定</text><text x="77" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">登録と完了は別</text><text x="399" y="276" text-anchor="middle" fill="#a7b8d2" font-family="system-ui,sans-serif" font-size="24">→</text><rect x="414" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="449" cy="189" r="15" fill="#e9efff"/><text x="449" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">2</text><text x="439" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">確認を続ける</text><text x="439" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">状態・ログ・成果物</text><text x="439" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">切断後も元の ID を使う</text><text x="761" y="276" text-anchor="middle" fill="#a7b8d2" font-family="system-ui,sans-serif" font-size="24">→</text><rect x="776" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="811" cy="189" r="15" fill="#e9efff"/><text x="811" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">3</text><text x="801" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">完了または取消</text><text x="801" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">最終状態を確認</text><text x="801" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">閉じるだけでは止まらない</text><text x="52" y="437" fill="#8b9bb2" font-family="system-ui,sans-serif" font-size="11">操作の流れ · 実際の結果はアプリとクライアントで確認</text></svg>