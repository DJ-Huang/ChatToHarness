<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc"><title id="title">安全な編集と取り消し</title><desc id="desc">現在の内容を読む / 変更する範囲を指定
安全なテキスト編集を使う / 記録を残す / 結果を読み直す
今回の取り消し記録を保存 / 戻すとき / 後の変更がなければ復元
競合は比較し、上書きしない</desc><rect width="1160" height="470" fill="#f5f7fc"/><text x="52" y="57" fill="#8496b3" font-family="system-ui,sans-serif" font-size="12" letter-spacing="3">CHATTOHARNESS / USER GUIDE</text><text x="52" y="108" fill="#263f66" font-family="system-ui,sans-serif" font-size="29" font-weight="650">安全な編集と取り消し</text><rect x="52" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="87" cy="189" r="15" fill="#e9efff"/><text x="87" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">1</text><text x="77" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">現在の内容を読む</text><text x="77" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">変更する範囲を指定</text><text x="77" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">安全なテキスト編集を使う</text><text x="399" y="276" text-anchor="middle" fill="#a7b8d2" font-family="system-ui,sans-serif" font-size="24">→</text><rect x="414" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="449" cy="189" r="15" fill="#e9efff"/><text x="449" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">2</text><text x="439" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">記録を残す</text><text x="439" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">結果を読み直す</text><text x="439" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">今回の取り消し記録を保存</text><text x="761" y="276" text-anchor="middle" fill="#a7b8d2" font-family="system-ui,sans-serif" font-size="24">→</text><rect x="776" y="150" width="332" height="236" rx="16" fill="white" stroke="#dce5f3"/><circle cx="811" cy="189" r="15" fill="#e9efff"/><text x="811" y="194" text-anchor="middle" fill="#3d62ac" font-family="system-ui,sans-serif" font-size="12">3</text><text x="801" y="242" fill="#345683" font-family="system-ui,sans-serif" font-size="19" font-weight="600">戻すとき</text><text x="801" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">後の変更がなければ復元</text><text x="801" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">競合は比較し、上書きしない</text><text x="52" y="437" fill="#8b9bb2" font-family="system-ui,sans-serif" font-size="11">操作の流れ · 実際の結果はアプリとクライアントで確認</text></svg>