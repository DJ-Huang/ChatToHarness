<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470" role="img" aria-labelledby="title desc"><title id="title">安全文本编辑与撤销</title><desc id="desc">读取当前版本 / 明确改动范围
