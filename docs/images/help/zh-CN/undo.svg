ui,sans-serif" font-size="19" font-weight="600">需要恢复时</text><text x="801" y="282" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">没有后续改动才撤销</text><text x="801" y="307" fill="#6b7f9e" font-family="system-ui,sans-serif" font-size="14">有冲突先比较，不覆盖</text><text x="52" y="437" fill="#8b9bb2" font-family="system-ui,sans-serif" font-size="11">操作顺序示意 · 实际结果请在应用和客户端核对</text></svg>